[project]
name = "ozon-barcode-generator"
version = "1.0.0"
description = "Генератор этикеток для Ozon с поддержкой Code 128 и пакетной обработки Excel"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "4ugasha", email = "aiazsha29@gmail.com"}
]
keywords = ["ozon", "barcode", "label", "pdf", "generator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "python-barcode>=0.15.1",
    "reportlab>=4.2.0",
    "Pillow>=10.0.0",
    "PySide6>=6.7.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
ozon-labels = "gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "config.ini",
    "fonts/*.ttf",
    "output/.gitkeep"
]